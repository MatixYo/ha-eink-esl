upload_image:
  name: Upload image
  description: Encode an image and transfer it to an e-ink shelf label over Bluetooth.
  target:
    device:
      integration: eink_esl
  fields:
    image:
      name: Image
      description: Base64 image data (or a data URL), or a file path under the Home Assistant config directory.
      required: true
      example: /config/esl/label.png
      selector:
        text:
          multiline: true
    fit:
      name: Fit
      description: How to fit the image onto the panel.
      default: contain
      selector:
        select:
          options:
            - contain
            - cover
            - stretch
    mode:
      name: Quantize mode
      description: Color quantization algorithm.
      default: floyd-steinberg
      selector:
        select:
          options:
            - nearest
            - floyd-steinberg
    background:
      name: Background
      description: Fill color for letterboxing when fit is contain/cover.
      default: white
      selector:
        select:
          options:
            - white
            - black

upload_weather:
  name: Upload weather
  description: Render current weather (plus a 5-day strip) and transfer it to an e-ink shelf label.
  target:
    device:
      integration: eink_esl
  fields:
    entity_id:
      name: Weather entity
      description: Home Assistant weather entity to render (for example weather.forecast_home).
      required: true
      selector:
        entity:
          domain: weather
