name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          title="${tag#v}"
          notes_file="$(mktemp)"
          if [[ -f CHANGELOG.md ]]; then
            # Extract the section for this version (literal match — [x] is not a regex class).
            awk -v ver="## [${title}]" '
              index($0, ver) == 1 {grab=1; next}
              grab && /^## \[/ {exit}
              grab {print}
            ' CHANGELOG.md > "${notes_file}"
          fi
          if [[ ! -s "${notes_file}" ]]; then
            echo "Release ${title}" > "${notes_file}"
          fi
          gh release create "${tag}" --title "${title}" --notes-file "${notes_file}"
