[project]
name = "ha-eink-esl"
version = "0.1.29"
description = "Home Assistant custom integration for Leeka-compatible e-ink ESL tags"
requires-python = ">=3.12"
dependencies = ["Pillow>=10.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
